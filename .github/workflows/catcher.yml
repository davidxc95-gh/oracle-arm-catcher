name: Oracle Dual Catcher (A1 + Micro)

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:         # botón para lanzarlo a mano

permissions:
  actions: write             # permite que se desactive solo al tener éxito total

jobs:
  catch-instances:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar OCI CLI oficial
        run: pip install oci-cli

      - name: Configurar credenciales de OCI
        run: |
          mkdir -p ~/.oci
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$(echo "${{ secrets.OCI_USER_OCID }}" | tr -d '[:space:]')
          fingerprint=$(echo "${{ secrets.OCI_FINGERPRINT }}" | tr -d '[:space:]')
          tenancy=$(echo "${{ secrets.OCI_TENANCY_OCID }}" | tr -d '[:space:]')
          region=$(echo "${{ secrets.OCI_REGION }}" | tr -d '[:space:]')
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: 1. Intentar crear la VM A1 (gratis)
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          # Obtener lista en crudo para evitar conflictos de sintaxis con jq en la misma linea
          RAW_LIST=$(oci compute instance list --compartment-id "$COMP_ID" --all 2>/dev/null)
          EXISTE_A1=$(echo "$RAW_LIST" | jq '[.data[]? | select(.shape=="VM.Standard.A1.Flex" and ."lifecycle-state"!="TERMINATED" and ."lifecycle-state"!="TERMINATING")] | length')
          
          if [ "${EXISTE_A1:-0}" -gt 0 ]; then
            echo "Ya existe una A1. No se intenta crear otra."
            echo "STATUS=YA_EXISTE" >> $GITHUB_ENV
            echo "A1_DONE=true" >> $GITHUB_ENV
            exit 0
          fi

          ssh-keygen -t ed25519 -f vm_key_a1 -N "" -q
          SUBNET_ID=$(oci network subnet list --compartment-id "$COMP_ID" --query "data[0].id" --raw-output)
          IMAGE_ID_A1=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.A1.Flex" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output)

          ADS=$(oci iam availability-domain list --query "data[].name" --raw-output | jq -r '.[]')
          for SIZE in "4 24" "2 12" "1 6"; do
            set -- $SIZE; OCPU=$1; MEM=$2
            for AD in $ADS; do
              echo "Probando A1: $OCPU núcleos / $MEM GB en $AD..."
              if oci compute instance launch \
                  --availability-domain "$AD" \
                  --compartment-id "$COMP_ID" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "{\"ocpus\": $OCPU, \"memoryInGBs\": $MEM}" \
                  --image-id "$IMAGE_ID_A1" \
                  --subnet-id "$SUBNET_ID" \
                  --assign-public-ip true \
                  --ssh-authorized-keys-file vm_key_a1.pub \
                  --display-name "a1-gratis" > launch_a1.json 2> error_a1.txt; then
                INST_ID=$(jq -r '.data.id' launch_a1.json)
                echo "¡A1 Creada! $INST_ID."
                oci compute instance get --instance-id "$INST_ID" --wait-for-state RUNNING --max-wait-seconds 600 > /dev/null || true
                IP=$(oci compute instance list-vnics --instance-id "$INST_ID" --query 'data[0]."public-ip"' --raw-output || echo "revisa la consola")
                echo "STATUS=SUCCESS" >> $GITHUB_ENV
                echo "VM_IP=$IP" >> $GITHUB_ENV
                echo "VM_SIZE=$OCPU núcleos / $MEM GB" >> $GITHUB_ENV
                echo "A1_DONE=true" >> $GITHUB_ENV
                exit 0
              fi
              cat error_a1.txt
            done
          done

          if grep -qiE "capacity|InternalError|TooManyRequests" error_a1.txt; then
            echo "Sin capacidad para A1 por ahora."
            echo "STATUS=CAPACITY_ERROR" >> $GITHUB_ENV
          else
            echo "STATUS=UNKNOWN_ERROR" >> $GITHUB_ENV
          fi
          echo "A1_DONE=false" >> $GITHUB_ENV

      - name: Avisar por Telegram del éxito de la A1
        if: env.A1_DONE == 'true' && env.STATUS == 'SUCCESS'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://telegram.org" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🎉 ¡VM A1 creada! ($VM_SIZE, gratis). IP: $VM_IP — Entra con: ssh -i vm_key_a1.pem ubuntu@$VM_IP"
          cp vm_key_a1 vm_key_a1.pem
          curl -s -X POST "https://telegram.org" \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@vm_key_a1.pem" \
            -F "caption=🔑 Llave privada SSH para la A1."

      - name: Avisar por Telegram de error raro en la A1
        if: env.A1_DONE == 'false' && env.STATUS == 'UNKNOWN_ERROR'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://telegram.org" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ Error raro en catcher A1: $(head -c 300 error_a1.txt)"

      - name: 2. Intentar crear la VM Micro (gratis)
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          # Obtener lista en crudo para evitar conflictos de sintaxis con jq en la misma linea
          RAW_LIST_MICRO=$(oci compute instance list --compartment-id "$COMP_ID" --all 2>/dev/null)
          EXISTE_MICRO=$(echo "$RAW_LIST_MICRO" | jq '[.data[]? | select(.shape=="VM.Standard.E2.1.Micro" and ."lifecycle-state"!="TERMINATED" and ."lifecycle-state"!="TERMINATING")] | length')
          
          if [ "${EXISTE_MICRO:-0}" -gt 0 ]; then
            echo "Ya existe una Micro. No se intenta crear otra."
            echo "STATUS_MICRO=YA_EXISTE" >> $GITHUB_ENV
            echo "MICRO_DONE=true" >> $GITHUB_ENV
            exit 0
          fi

          ssh-keygen -t ed25519 -f vm_key_micro -N "" -q
          SUBNET_ID=$(oci network subnet list --compartment-id "$COMP_ID" --query "data[0].id" --raw-output)
          IMAGE_ID_MICRO=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.E2.1.Micro" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output)

          ADS=$(oci iam availability-domain list --query "data[].name" --raw-output | jq -r '.[]')
          for AD in $ADS; do
            echo "Probando Micro (AMD) en $AD..."
            if oci compute instance launch \
                --availability-domain "$AD" \
                --compartment-id "$COMP_ID" \
                --shape "VM.Standard.E2.1.Micro" \
                --image-id "$IMAGE_ID_MICRO" \
                --subnet-id "$SUBNET_ID" \
                --assign-public-ip true \
                --ssh-authorized-keys-file vm_key_micro.pub \
                --display-name "micro-gratis" > launch_micro.json 2> error_micro.txt; then
              INST_ID=$(jq -r '.data.id' launch_micro.json)
              echo "¡Micro Creada! $INST_ID."
              oci compute instance get --instance-id "$INST_ID" --wait-for-state RUNNING --max-wait-seconds 600 > /dev/null || true
              IP=$(oci compute instance list-vnics --instance-id "$INST_ID" --query 'data[0]."public-ip"' --raw-output || echo "revisa la consola")
              echo "STATUS_MICRO=SUCCESS" >> $GITHUB_ENV
              echo "VM_IP_MICRO=$IP" >> $GITHUB_ENV
              echo "MICRO_DONE=true" >> $GITHUB_ENV
              exit 0
            fi
            cat error_micro.txt
          done

          if grep -qiE "capacity|InternalError|TooManyRequests" error_micro.txt; then
            echo "Sin capacidad para Micro por ahora."
            echo "STATUS_MICRO=CAPACITY_ERROR" >> $GITHUB_ENV
          else
            echo "STATUS_MICRO=UNKNOWN_ERROR" >> $GITHUB_ENV
          fi
          echo "MICRO_DONE=false" >> $GITHUB_ENV

      - name: Avisar por Telegram del éxito de la Micro
        if: env.MICRO_DONE == 'true' && env.STATUS_MICRO == 'SUCCESS'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://telegram.org" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🎉 ¡VM Micro creada! (1 OCPU / 1 GB, gratis). IP: $VM_IP_MICRO — Entra con: ssh -i vm_key_micro.pem ubuntu@$VM_IP_MICRO"
          cp vm_key_micro vm_key_micro.pem
          curl -s -X POST "https://telegram.org" \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@vm_key_micro.pem" \
            -F "caption=🔑 Llave privada SSH para la Micro."

      - name: Avisar por Telegram de error raro en la Micro
        if: env.MICRO_DONE == 'false' && env.STATUS_MICRO == 'UNKNOWN_ERROR'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://telegram.org" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ Error raro en catcher Micro: $(head -c 300 error_micro.txt)"

      - name: Desactivar este workflow (Solo si ambas instancias están listas o ya existen)
        if: (env.A1_DONE == 'true') && (env.MICRO_DONE == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
