name: Oracle Dual Catcher (A1 + Micro + Reportes)

on:
  schedule:
    - cron: '*/5 * * * *'   # catcher: intenta crear VMs cada 5 minutos
    - cron: '0 17 * * *'    # reporte: 17:00 UTC = 14:00 en Chile (UTC-3)
    - cron: '0 2 * * *'     # reporte: 02:00 UTC = 23:00 en Chile (UTC-3)
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de esta ejecucion'
        type: choice
        options:
          - catcher
          - reporte
        default: catcher

permissions:
  actions: write

jobs:
  catch-instances:
    runs-on: ubuntu-latest
    # Grupos separados: un reporte nunca se encola (ni se cancela) detras de los catchers
    concurrency:
      group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.modo == 'reporte') || (github.event_name == 'schedule' && (github.event.schedule == '0 17 * * *' || github.event.schedule == '0 2 * * *'))) && 'reporte-telegram' || 'oracle-catcher' }}
      cancel-in-progress: false

    steps:
      - name: Determinar modo (catcher o reporte)
        run: |
          case "${{ github.event.schedule }}" in
            "0 17 * * *"|"0 2 * * *") MODO_FINAL=reporte ;;
            *) MODO_FINAL=catcher ;;
          esac
          if [ "${{ inputs.modo }}" = "reporte" ]; then
            MODO_FINAL=reporte
          fi
          echo "MODE=$MODO_FINAL" >> $GITHUB_ENV
          echo "Modo de esta ejecucion: $MODO_FINAL"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar OCI CLI oficial
        run: pip install oci-cli

      - name: Configurar credenciales de OCI
        run: |
          mkdir -p ~/.oci
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$(echo "${{ secrets.OCI_USER_OCID }}" | tr -d '[:space:]')
          fingerprint=$(echo "${{ secrets.OCI_FINGERPRINT }}" | tr -d '[:space:]')
          tenancy=$(echo "${{ secrets.OCI_TENANCY_OCID }}" | tr -d '[:space:]')
          region=$(echo "${{ secrets.OCI_REGION }}" | tr -d '[:space:]')
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      # ---------------------------------------------------------------------
      # La clave SSH NUNCA se genera en el runner: se usa la publica que
      # guardaste como secret. La privada vive solo en tu PC -> no se pierde.
      # ---------------------------------------------------------------------
      - name: Preparar clave SSH publica (solo modo catcher)
        if: env.MODE == 'catcher'
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "::error::Falta el secret SSH_PUBLIC_KEY. En tu PC ejecuta: ssh-keygen -t ed25519 -f oci_freetier  y guarda el contenido de oci_freetier.pub como secret SSH_PUBLIC_KEY."
            exit 1
          fi
          PUBKEY=$(printf '%s' "$SSH_PUBLIC_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//')
          printf '%s\n' "$PUBKEY" > ~/.ssh/oci_freetier.pub
          if ! grep -qE '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-)' ~/.ssh/oci_freetier.pub; then
            echo "::error::El secret SSH_PUBLIC_KEY no parece una clave SSH publica valida."
            exit 1
          fi
          echo "Clave SSH publica preparada (firma): $(cut -d' ' -f1,2 ~/.ssh/oci_freetier.pub | cut -c1-45)..."

      - name: 1. Intentar crear la VM A1 (gratis)
        if: env.MODE == 'catcher'
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          RAW_LIST=$(oci compute instance list --compartment-id "$COMP_ID" --all 2>/dev/null || true)
          EXISTE_A1=$(echo "$RAW_LIST" | jq '[.data[]? | select(.shape=="VM.Standard.A1.Flex" and ."lifecycle-state"!="TERMINATED" and ."lifecycle-state"!="TERMINATING")] | length' 2>/dev/null || echo 0)

          if [ "${EXISTE_A1:-0}" -gt 0 ]; then
            echo "Ya existe una A1. No se intenta crear otra."
            echo "STATUS=YA_EXISTE" >> $GITHUB_ENV
            echo "A1_DONE=true" >> $GITHUB_ENV
            exit 0
          fi

          SUBNET_ID=$(oci network subnet list --compartment-id "$COMP_ID" --query "data[0].id" --raw-output)
          IMAGE_ID_A1=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.A1.Flex" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output)

          ADS=$(oci iam availability-domain list --query "data[].name" --raw-output | jq -r '.[]')
          for SIZE in "2 12" "1 6"; do
            set -- $SIZE; OCPU=$1; MEM=$2
            for AD in $ADS; do
              echo "Probando A1: $OCPU nucleos / $MEM GB en $AD..."
              if oci compute instance launch \
                  --availability-domain "$AD" \
                  --compartment-id "$COMP_ID" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "{\"ocpus\": $OCPU, \"memoryInGBs\": $MEM}" \
                  --image-id "$IMAGE_ID_A1" \
                  --subnet-id "$SUBNET_ID" \
                  --assign-public-ip true \
                  --ssh-authorized-keys-file ~/.ssh/oci_freetier.pub \
                  --display-name "a1-gratis" > launch_a1.json 2> error_a1.txt; then
                INST_ID=$(jq -r '.data.id' launch_a1.json)
                echo "A1 Creada! $INST_ID."
                echo "$(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S') | A1 ${OCPU}/${MEM} ${AD##*:} | CREADA $INST_ID" >> intentos_pendientes.txt
                IP=""
                for i in $(seq 1 30); do
                  IP=$(oci compute instance list-vnics --instance-id "$INST_ID" --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
                  if [ -n "$IP" ] && [ "$IP" != "null" ]; then break; fi
                  echo "Esperando IP... (intento $i)"
                  sleep 10
                done
                echo "STATUS=SUCCESS" >> $GITHUB_ENV
                echo "VM_IP=${IP:-SIN_IP}" >> $GITHUB_ENV
                echo "VM_SIZE=$OCPU nucleos / $MEM GB" >> $GITHUB_ENV
                echo "A1_DONE=true" >> $GITHUB_ENV
                exit 0
              fi
              ERRMSG=$(head -c 160 error_a1.txt | tr '\n|' '  ')
              if echo "$ERRMSG" | grep -qiE "capacity|InternalError|TooManyRequests"; then
                RES="SIN_CAPACIDAD"
              else
                RES="ERROR: $ERRMSG"
              fi
              echo "$(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S') | A1 ${OCPU}/${MEM} ${AD##*:} | $RES" >> intentos_pendientes.txt
              cat error_a1.txt
            done
          done

          if grep -qiE "capacity|InternalError|TooManyRequests" error_a1.txt; then
            echo "Sin capacidad para A1 por ahora."
            echo "STATUS=CAPACITY_ERROR" >> $GITHUB_ENV
          else
            echo "STATUS=UNKNOWN_ERROR" >> $GITHUB_ENV
          fi
          echo "A1_DONE=false" >> $GITHUB_ENV

      - name: Avisar por Telegram del exito de la A1
        if: env.MODE == 'catcher' && env.A1_DONE == 'true' && env.STATUS == 'SUCCESS'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=VM A1 CREADA (${VM_SIZE}, gratis) - IP: ${VM_IP} - SSH: ssh -i <ruta>\oci_freetier ubuntu@${VM_IP}")
          echo "Respuesta Telegram: $(echo "$RESP" | head -c 300)"

      - name: Avisar por Telegram de error raro en la A1
        if: env.MODE == 'catcher' && env.A1_DONE == 'false' && env.STATUS == 'UNKNOWN_ERROR'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Error raro en catcher A1: $(head -c 300 error_a1.txt)")
          echo "Respuesta Telegram: $(echo "$RESP" | head -c 300)"

      - name: 2. Intentar crear la VM Micro (gratis)
        if: env.MODE == 'catcher'
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          RAW_LIST_MICRO=$(oci compute instance list --compartment-id "$COMP_ID" --all 2>/dev/null || true)
          EXISTE_MICRO=$(echo "$RAW_LIST_MICRO" | jq '[.data[]? | select(.shape=="VM.Standard.E2.1.Micro" and ."lifecycle-state"!="TERMINATED" and ."lifecycle-state"!="TERMINATING")] | length' 2>/dev/null || echo 0)

          if [ "${EXISTE_MICRO:-0}" -gt 0 ]; then
            echo "Ya existe una Micro. No se intenta crear otra."
            echo "STATUS_MICRO=YA_EXISTE" >> $GITHUB_ENV
            echo "MICRO_DONE=true" >> $GITHUB_ENV
            exit 0
          fi

          SUBNET_ID=$(oci network subnet list --compartment-id "$COMP_ID" --query "data[0].id" --raw-output)
          IMAGE_ID_MICRO=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.E2.1.Micro" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output)

          ADS=$(oci iam availability-domain list --query "data[].name" --raw-output | jq -r '.[]')
          for AD in $ADS; do
            echo "Probando Micro (AMD) en $AD..."
            if oci compute instance launch \
                --availability-domain "$AD" \
                --compartment-id "$COMP_ID" \
                --shape "VM.Standard.E2.1.Micro" \
                --image-id "$IMAGE_ID_MICRO" \
                --subnet-id "$SUBNET_ID" \
                --assign-public-ip true \
                --ssh-authorized-keys-file ~/.ssh/oci_freetier.pub \
                --display-name "micro-gratis" > launch_micro.json 2> error_micro.txt; then
              INST_ID=$(jq -r '.data.id' launch_micro.json)
              echo "Micro Creada! $INST_ID."
              echo "$(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S') | Micro ${AD##*:} | CREADA $INST_ID" >> intentos_pendientes.txt
              IP=""
              for i in $(seq 1 30); do
                IP=$(oci compute instance list-vnics --instance-id "$INST_ID" --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
                if [ -n "$IP" ] && [ "$IP" != "null" ]; then break; fi
                echo "Esperando IP... (intento $i)"
                sleep 10
              done
              echo "STATUS_MICRO=SUCCESS" >> $GITHUB_ENV
              echo "VM_IP_MICRO=${IP:-SIN_IP}" >> $GITHUB_ENV
              echo "MICRO_DONE=true" >> $GITHUB_ENV
              exit 0
            fi
            ERRMSG=$(head -c 160 error_micro.txt | tr '\n|' '  ')
            if echo "$ERRMSG" | grep -qiE "capacity|InternalError|TooManyRequests"; then
              RES="SIN_CAPACIDAD"
            else
              RES="ERROR: $ERRMSG"
            fi
            echo "$(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S') | Micro ${AD##*:} | $RES" >> intentos_pendientes.txt
            cat error_micro.txt
          done

          if grep -qiE "capacity|InternalError|TooManyRequests" error_micro.txt; then
            echo "Sin capacidad para Micro por ahora."
            echo "STATUS_MICRO=CAPACITY_ERROR" >> $GITHUB_ENV
          else
            echo "STATUS_MICRO=UNKNOWN_ERROR" >> $GITHUB_ENV
          fi
          echo "MICRO_DONE=false" >> $GITHUB_ENV

      - name: Avisar por Telegram del exito de la Micro
        if: env.MODE == 'catcher' && env.MICRO_DONE == 'true' && env.STATUS_MICRO == 'SUCCESS'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=VM Micro CREADA (1 OCPU / 1 GB, gratis) - IP: ${VM_IP_MICRO} - SSH: ssh -i <ruta>\oci_freetier ubuntu@${VM_IP_MICRO}")
          echo "Respuesta Telegram: $(echo "$RESP" | head -c 300)"

      - name: Avisar por Telegram de error raro en la Micro
        if: env.MODE == 'catcher' && env.MICRO_DONE == 'false' && env.STATUS_MICRO == 'UNKNOWN_ERROR'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Error raro en catcher Micro: $(head -c 300 error_micro.txt)")
          echo "Respuesta Telegram: $(echo "$RESP" | head -c 300)"

      # Guarda los intentos de esta ejecucion en Object Storage (gratis en tu
      # free tier) para poder leerlos despues en el reporte de las 14:00/23:00.
      - name: Registrar intentos del dia en Object Storage
        if: always() && env.MODE == 'catcher'
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          if [ ! -s intentos_pendientes.txt ]; then
            echo "Sin intentos que registrar en esta ejecucion."
            exit 0
          fi
          NS=$(oci os ns get --query '"data"' --raw-output)
          BUCKET="catcher-intents"
          # Crear el bucket si no existe (el error "ya existe" se ignora)
          oci os bucket create --compartment-id "$COMP_ID" --name "$BUCKET" \
            --storage-tier Standard >/dev/null 2>&1 || true
          TS=$(TZ=America/Santiago date +%Y%m%dT%H%M%S)
          OBJ="${TS}-${GITHUB_RUN_ID}.log"
          if oci os object put --namespace-name "$NS" --bucket-name "$BUCKET" \
               --name "$OBJ" --file intentos_pendientes.txt --force; then
            echo "Intentos guardados en $BUCKET/$OBJ ($(wc -l < intentos_pendientes.txt) lineas)."
          else
            echo "::warning::No se pudieron guardar los intentos en Object Storage."
          fi

      # ---------------------------------------------------------------------
      # REPORTE (14:00 y 23:00 hora de Chile): lee los intentos del dia y
      # los resume por Telegram. Tambien se puede lanzar a mano con modo=reporte.
      # ---------------------------------------------------------------------
      - name: Enviar reporte de intentos por Telegram
        if: env.MODE == 'reporte'
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NS=$(oci os ns get --query '"data"' --raw-output)
          BUCKET="catcher-intents"
          HOY=$(TZ=America/Santiago date +%Y%m%d)
          mkdir -p /tmp/rep
          rm -f /tmp/rep/*

          # Archivos de intentos de hoy (el catcher los nombra con fecha de Chile)
          oci os object list --namespace-name "$NS" --bucket-name "$BUCKET" \
            --prefix "$HOY" --query 'data[].name' --raw-output \
            > /tmp/rep/names.txt 2>/dev/null || true

          TOTAL_OBJ=$(grep -c . /tmp/rep/names.txt 2>/dev/null || echo 0)
          echo "Archivos de intentos del dia: $TOTAL_OBJ"

          while IFS= read -r OBJ; do
            [ -z "$OBJ" ] && continue
            oci os object get --namespace-name "$NS" --bucket-name "$BUCKET" \
              -n "$OBJ" --file "/tmp/rep/$OBJ" --force >/dev/null 2>&1 || true
          done < /tmp/rep/names.txt

          cat /tmp/rep/*.log > /tmp/rep/intentos.txt 2>/dev/null || true
          touch /tmp/rep/intentos.txt

          TOTAL=$(wc -l < /tmp/rep/intentos.txt | tr -d ' ')
          CAP=$(grep -c "SIN_CAPACIDAD" /tmp/rep/intentos.txt || true)
          OK=$(grep -c "| CREADA" /tmp/rep/intentos.txt || true)
          ERR=$(grep -c "| ERROR" /tmp/rep/intentos.txt || true)
          A1=$(grep -c "| A1 " /tmp/rep/intentos.txt || true)
          MIC=$(grep -c "| Micro " /tmp/rep/intentos.txt || true)

          VM_ACT=$(oci compute instance list --compartment-id "$COMP_ID" --all 2>/dev/null \
            | jq -r '[.data[]? | select(."lifecycle-state" != "TERMINATED" and ."lifecycle-state" != "TERMINATING") | .["display-name"] + " (" + ."lifecycle-state" + ")"] | join(", ")')
          [ -z "$VM_ACT" ] && VM_ACT="ninguna"

          {
            echo "REPORTE DE INTENTOS - $(TZ=America/Santiago date '+%d/%m/%Y %H:%M')"
            echo "VMs activas: $VM_ACT"
            echo ""
            echo "Intentos hasta ahora: $TOTAL  (A1: $A1 | Micro: $MIC)"
            echo "Sin capacidad: $CAP | Creadas: $OK | Errores: $ERR"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "Sin intentos registrados. (¿El catcher ya corrió con la versión nueva? ¿Existe el bucket $BUCKET?)"
            else
              echo "Últimos intentos:"
              tail -n 20 /tmp/rep/intentos.txt | cut -c1-160
              if [ "$TOTAL" -gt 20 ]; then
                echo ""
                echo "(+ $((TOTAL - 20)) anteriores, omitidas por longitud)"
              fi
            fi
          } > /tmp/rep/mensaje.txt

          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/rep/mensaje.txt")
          echo "Respuesta Telegram: $(echo "$RESP" | head -c 300)"

      - name: Desactivar este workflow (Solo si ambas instancias estan listas o ya existen)
        if: env.MODE == 'catcher' && env.A1_DONE == 'true' && env.MICRO_DONE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
