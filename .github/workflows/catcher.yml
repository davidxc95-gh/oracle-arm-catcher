name: Oracle ARM Catcher

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta automáticamente cada 5 minutos en la nube
  workflow_dispatch: # Te permite activarlo manualmente presionando un botón

jobs:
  catch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar OCI CLI
        uses: sushilops/setup-oci-cli@v1.0.0
        with:
          user_ocid: ${{ secrets.OCI_USER_OCID }}
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          region: ${{ secrets.OCI_REGION }}

      - name: Intentar crear la máquina virtual
        id: create_vm
        run: |
          echo "Buscando datos de red en Oracle..."
          AD_NAME=$(oci iam availability-domain list --query "data[0].name" --raw-output)
          COMP_ID="${{ secrets.OCI_COMPARTMENT_OCID }}"
          
          SUBNET_ID=$(oci network subnet list --compartment-id "$COMP_ID" --query "data[0].id" --raw-output)
          IMAGE_ID=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.A1.Flex" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --query "data[0].id" --raw-output)
          
          echo "Intentando solicitar la instancia ARM en el dominio: $AD_NAME..."
          
          RESPONSE=$(oci compute instance launch \
            --availability-domain "$AD_NAME" \
            --compartment-id "$COMP_ID" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 1, "memoryInGBs": 6}' \
            --image-id "$IMAGE_ID" \
            --subnet-id "$SUBNET_ID" \
            --assign-public-ip true \
            2>&1) || true
          
          echo "Respuesta de Oracle: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Instance"* || "$RESPONSE" == *"PROVISIONING"* ]]; then
            echo "STATUS=SUCCESS" >> $GITHUB_ENV
          elif [[ "$RESPONSE" == *"Out of capacity"* || "$RESPONSE" == *"insufficient"* || "$RESPONSE" == *"Capacity"* ]]; then
            echo "STATUS=CAPACITY_ERROR" >> $GITHUB_ENV
          else
            echo "STATUS=UNKNOWN_ERROR" >> $GITHUB_ENV
            echo "ERROR_MSG=$RESPONSE" >> $GITHUB_ENV
          fi

      - name: Enviar mensaje por Telegram si tiene éxito
        if: env.STATUS == 'SUCCESS'
        run: |
          curl -s -X POST "https://telegram.org{{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🎉 ¡ÉXITO! Tu servidor Oracle ARM (1 OCPU / 6 GB RAM) ha sido creado con éxito. Ya puedes revisarlo en tu consola."

      - name: Alerta por Telegram si ocurre un error grave (No de capacidad)
        if: env.STATUS == 'UNKNOWN_ERROR'
        run: |
          # Limpiamos el mensaje de error para evitar fallos de formato en curl
          CLEAN_MSG=$(echo "${{ env.ERROR_MSG }}" | head -n 2 | tr -d '"')
          curl -s -X POST "https://telegram.org{{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=⚠️ Error en el script de Oracle: $CLEAN_MSG"
