name: Oracle A1 Catcher

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:         # botón para lanzarlo a mano

permissions:
  actions: write             # permite que se desactive solo al tener éxito

jobs:
  catch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar OCI CLI oficial
        run: pip install oci-cli

      - name: Configurar credenciales de OCI
        run: |
          mkdir -p ~/.oci
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$(echo "${{ secrets.OCI_USER_OCID }}" | tr -d '[:space:]')
          fingerprint=$(echo "${{ secrets.OCI_FINGERPRINT }}" | tr -d '[:space:]')
          tenancy=$(echo "${{ secrets.OCI_TENANCY_OCID }}" | tr -d '[:space:]')
          region=$(echo "${{ secrets.OCI_REGION }}" | tr -d '[:space:]')
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Intentar crear la VM A1 (gratis)
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          # 1. Si ya existe una A1 activa, no crear otra (evita duplicados y cobros)
          EXISTE=$(oci compute instance list --compartment-id "$COMP_ID" --all 2>/dev/null \
            | jq '[.data[]? | select(.shape=="VM.Standard.A1.Flex"
                   and ."lifecycle-state"!="TERMINATED" and ."lifecycle-state"!="TERMINATING")] | length')
          if [ "${EXISTE:-0}" -gt 0 ]; then
            echo "Ya existe una A1. No se crea otra."
            echo "STATUS=YA_EXISTE" >> $GITHUB_ENV
            exit 0
          fi

          # 2. Llave SSH para entrar a la VM (se envía por Telegram solo si hay éxito)
          ssh-keygen -t ed25519 -f vm_key -N "" -q

          # 3. Red e imagen de Ubuntu 24.04 compatible con ARM (A1)
          SUBNET_ID=$(oci network subnet list --compartment-id "$COMP_ID" --query "data[0].id" --raw-output)
          IMAGE_ID=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.A1.Flex" \
            --operating-system "Canonical Ubuntu" --operating-system-version "24.04" \
            --sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output)

          # 4. Probar tamaños de mayor a menor, en cada centro de datos
          ADS=$(oci iam availability-domain list --query "data[].name" --raw-output | jq -r '.[]')
          for SIZE in "4 24" "2 12" "1 6"; do
            set -- $SIZE; OCPU=$1; MEM=$2
            for AD in $ADS; do
              echo "Probando $OCPU núcleos / $MEM GB en $AD..."
              if oci compute instance launch \
                  --availability-domain "$AD" \
                  --compartment-id "$COMP_ID" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "{\"ocpus\": $OCPU, \"memoryInGBs\": $MEM}" \
                  --image-id "$IMAGE_ID" \
                  --subnet-id "$SUBNET_ID" \
                  --assign-public-ip true \
                  --ssh-authorized-keys-file vm_key.pub \
                  --display-name "a1-gratis" > launch.json 2> error.txt; then
                INST_ID=$(jq -r '.data.id' launch.json)
                echo "¡Creada! $INST_ID. Esperando a que encienda para obtener la IP..."
                oci compute instance get --instance-id "$INST_ID" --wait-for-state RUNNING --max-wait-seconds 600 > /dev/null || true
                IP=$(oci compute instance list-vnics --instance-id "$INST_ID" --query 'data[0]."public-ip"' --raw-output || echo "revisa la consola")
                echo "STATUS=SUCCESS" >> $GITHUB_ENV
                echo "VM_IP=$IP" >> $GITHUB_ENV
                echo "VM_SIZE=$OCPU núcleos / $MEM GB" >> $GITHUB_ENV
                exit 0
              fi
              cat error.txt
            done
          done

          # 5. No se pudo: ¿falta de capacidad (normal) o error raro?
          if grep -qiE "capacity|InternalError|TooManyRequests" error.txt; then
            echo "Sin capacidad por ahora. Se reintenta en 5 minutos."
            echo "STATUS=CAPACITY_ERROR" >> $GITHUB_ENV
          else
            echo "STATUS=UNKNOWN_ERROR" >> $GITHUB_ENV
          fi

      - name: Avisar por Telegram del éxito (IP + llave)
        if: env.STATUS == 'SUCCESS'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🎉 ¡VM A1 creada! ($VM_SIZE, gratis). IP: $VM_IP — Entra con: ssh -i vm_key.pem ubuntu@$VM_IP"
          cp vm_key vm_key.pem
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@vm_key.pem" \
            -F "caption=🔑 Llave privada SSH. Descárgala, guárdala y BORRA este mensaje del chat."

      - name: Avisar por Telegram de un error raro
        if: env.STATUS == 'UNKNOWN_ERROR'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ Error en el catcher A1: $(head -c 400 error.txt)"

      - name: Desactivar este workflow (ya hay VM)
        if: env.STATUS == 'SUCCESS' || env.STATUS == 'YA_EXISTE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
