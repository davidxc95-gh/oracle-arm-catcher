Name: Oracle AMD Micro Catcher

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta automáticamente cada 5 minutos
  workflow_dispatch: # Permite activación manual

jobs:
  catch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar OCI CLI oficial
        run: pip install oci-cli

      - name: Configurar credenciales de OCI
        run: |
          mkdir -p ~/.oci
          USER_OCID=$(echo "${{ secrets.OCI_USER_OCID }}" | tr -d '[:space:]')
          FINGERPRINT=$(echo "${{ secrets.OCI_FINGERPRINT }}" | tr -d '[:space:]')
          TENANCY_OCID=$(echo "${{ secrets.OCI_TENANCY_OCID }}" | tr -d '[:space:]')
          REGION=$(echo "${{ secrets.OCI_REGION }}" | tr -d '[:space:]')
          
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$USER_OCID
          fingerprint=$FINGERPRINT
          tenancy=$TENANCY_OCID
          region=$REGION
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Intentar crear la máquina virtual AMD Micro
        id: create_vm
        run: |
          CURRENT_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "TIMESTAMP=$CURRENT_TIME" >> $GITHUB_ENV

          echo "Generando par de claves SSH temporales para la VM..."
          ssh-keygen -t rsa -b 2048 -f ~/.ssh/id_rsa -N ""
          
          # Guardamos la clave privada de forma segura en las variables de entorno del runner
          {
            echo 'SSH_PRIV_KEY<<EOF'
            cat ~/.ssh/id_rsa
            echo 'EOF'
          } >> $GITHUB_ENV

          echo "Buscando datos de red en Oracle..."
          AD_NAME=$(oci iam availability-domain list --query "data[0].name" --raw-output)
          COMP_ID="${{ secrets.OCI_COMPARTMENT_OCID }}"
          
          SUBNET_ID=$(oci network subnet list --compartment-id "$COMP_ID" --query "data[0].id" --raw-output)
          
          # Buscamos una imagen compatible con la arquitectura AMD/x86_64 para la Micro (VM.Standard.E2.1.Micro)
          IMAGE_ID=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.E2.1.Micro" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --query "data[0].id" --raw-output)
          
          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" == "null" ]; then
            IMAGE_ID=$(oci compute image list --compartment-id "$COMP_ID" --shape "VM.Standard.E2.1.Micro" --operating-system "Canonical Ubuntu" --query "data[0].id" --raw-output)
          fi

          echo "Intentando solicitar la instancia AMD Micro en el dominio: $AD_NAME..."
          
          # NOTA: Al ser VM.Standard.E2.1.Micro (instancia fija), no requiere --shape-config
          RESPONSE=$(oci compute instance launch \
            --availability-domain "$AD_NAME" \
            --compartment-id "$COMP_ID" \
            --shape "VM.Standard.E2.1.Micro" \
            --image-id "$IMAGE_ID" \
            --subnet-id "$SUBNET_ID" \
            --assign-public-ip true \
            --ssh-authorized-keys-file ~/.ssh/id_rsa.pub \
            2>&1) || true
          
          echo "Respuesta de Oracle: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Instance"* || "$RESPONSE" == *"PROVISIONING"* ]]; then
            echo "STATUS=SUCCESS" >> $GITHUB_ENV
          elif [[ "$RESPONSE" == *"Out of capacity"* || "$RESPONSE" == *"insufficient"* || "$RESPONSE" == *"Capacity"* || "$RESPONSE" == *"InternalError"* ]]; then
            echo "STATUS=CAPACITY_ERROR" >> $GITHUB_ENV
          else
            echo "STATUS=UNKNOWN_ERROR" >> $GITHUB_ENV
            CLEAN_ERR=$(echo "$RESPONSE" | tr -d '\n' | tr -d '"')
            echo "ERROR_MSG=$CLEAN_ERR" >> $GITHUB_ENV
          fi

      - name: Enviar mensaje y clave por Telegram si tiene éxito
        if: ${{ env.STATUS == 'SUCCESS' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. Enviar aviso de texto
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            -d "text=🎉 ¡ÉXITO! Tu servidor Oracle AMD Micro ha sido creado a las ${{ env.TIMESTAMP }}. Revisa el documento adjunto para obtener tu llave privada SSH."

          # 2. Enviar el archivo con la clave privada (.pem) directamente a Telegram
          echo "${{ env.SSH_PRIV_KEY }}" > oci_vm_key.pem
          chmod 600 oci_vm_key.pem
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@oci_vm_key.pem" \
            -F "caption=🔑 Clave privada SSH (Guárdala bien en tu equipo)."

      - name: Enviar aviso por Telegram de intento fallido (Sin capacidad)
        if: ${{ env.STATUS == 'CAPACITY_ERROR' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            -d "text=⏳ Intento fallido AMD Micro por falta de capacidad. Hora: ${{ env.TIMESTAMP }}"

      - name: Alerta por Telegram si ocurre un error grave (Desconocido)
        if: ${{ env.STATUS == 'UNKNOWN_ERROR' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            -d "text=⚠️ Error técnico AMD Micro a las ${{ env.TIMESTAMP }}: ${{ env.ERROR_MSG }}"
