name: Reporte Telegram (14:00 y 23:00)

on:
  schedule:
    - cron: '0 17 * * *'   # 17:00 UTC = 14:00 en Chile (UTC-3)
    - cron: '0 2 * * *'    # 02:00 UTC = 23:00 en Chile (UTC-3)
  workflow_dispatch:         # botón para probarlo a mano

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar OCI CLI oficial
        run: pip install oci-cli

      - name: Configurar credenciales de OCI
        run: |
          mkdir -p ~/.oci
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=$(echo "${{ secrets.OCI_USER_OCID }}" | tr -d '[:space:]')
          fingerprint=$(echo "${{ secrets.OCI_FINGERPRINT }}" | tr -d '[:space:]')
          tenancy=$(echo "${{ secrets.OCI_TENANCY_OCID }}" | tr -d '[:space:]')
          region=$(echo "${{ secrets.OCI_REGION }}" | tr -d '[:space:]')
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Recopilar intentos del dia y avisar por Telegram
        env:
          COMP_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NS=$(oci os ns get --query '"data"' --raw-output)
          BUCKET="catcher-intents"
          HOY=$(TZ=America/Santiago date +%Y%m%d)
          mkdir -p /tmp/rep
          rm -f /tmp/rep/*

          # Todos los archivos de intentos de hoy (el catcher nombra cada uno
          # con la fecha de Chile: AAAAmmddTHHMMSS-<run_id>.log)
          oci os object list --namespace-name "$NS" --bucket-name "$BUCKET" \
            --prefix "$HOY" --query 'data[].name' --raw-output \
            > /tmp/rep/names.txt 2>/dev/null || true

          TOTAL_OBJ=$(grep -c . /tmp/rep/names.txt 2>/dev/null || echo 0)
          echo "Archivos de intentos del dia: $TOTAL_OBJ"

          while IFS= read -r OBJ; do
            [ -z "$OBJ" ] && continue
            oci os object get --namespace-name "$NS" --bucket-name "$BUCKET" \
              -n "$OBJ" --file "/tmp/rep/$OBJ" --force >/dev/null 2>&1 || true
          done < /tmp/rep/names.txt

          cat /tmp/rep/*.log > /tmp/rep/intentos.txt 2>/dev/null || true
          touch /tmp/rep/intentos.txt

          TOTAL=$(wc -l < /tmp/rep/intentos.txt | tr -d ' ')
          CAP=$(grep -c "SIN_CAPACIDAD" /tmp/rep/intentos.txt || true)
          OK=$(grep -c "| CREADA" /tmp/rep/intentos.txt || true)
          ERR=$(grep -c "| ERROR" /tmp/rep/intentos.txt || true)
          A1=$(grep -c "| A1 " /tmp/rep/intentos.txt || true)
          MIC=$(grep -c "| Micro " /tmp/rep/intentos.txt || true)

          VM_ACT=$(oci compute instance list --compartment-id "$COMP_ID" --all 2>/dev/null \
            | jq -r '[.data[]? | select(."lifecycle-state" != "TERMINATED" and ."lifecycle-state" != "TERMINATING") | .["display-name"] + " (" + ."lifecycle-state" + ")"] | join(", ")')
          [ -z "$VM_ACT" ] && VM_ACT="ninguna"

          {
            echo "📋 Reporte de intentos — $(TZ=America/Santiago date '+%d/%m/%Y %H:%M')"
            echo "VMs activas: $VM_ACT"
            echo ""
            echo "Intentos hasta ahora: $TOTAL  (A1: $A1 | Micro: $MIC)"
            echo "Sin capacidad: $CAP | Creadas: $OK | Errores: $ERR"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "Sin intentos registrados. (¿El catcher ya corrió con la versión nueva? ¿Existe el bucket $BUCKET?)"
            else
              echo "Últimos intentos:"
              tail -n 20 /tmp/rep/intentos.txt | cut -c1-160
              if [ "$TOTAL" -gt 20 ]; then
                echo ""
                echo "(+ $((TOTAL - 20)) anteriores, omitidas por longitud)"
              fi
            fi
          } > /tmp/rep/mensaje.txt

          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/rep/mensaje.txt")
          echo "Respuesta Telegram: $(echo "$RESP" | head -c 300)"
